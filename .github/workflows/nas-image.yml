name: NAS image

# Keeps this fork's RetroArr current and published for Watchtower:
#  1. merges RiDDiX/RetroArr main into this main once a day (a merge commit, nothing is rewritten)
#  2. when that brought something new, or on a push to main: runs the tests and publishes
#     ghcr.io/dviree/retroarrnas:latest, which Watchtower on the NAS picks up
# A merge conflict, or upstream changing a workflow file (GITHUB_TOKEN may not push those), stops the run
# and GitHub emails the failure; "Sync fork" on the repository page then finishes the merge by hand.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'nas/**'
      - '**.md'

permissions:
  contents: write
  packages: write

concurrency:
  group: nas-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dviree/retroarrnas

jobs:
  sync:
    if: github.repository == 'dviree/RetroArrNAS'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/RiDDiX/RetroArr.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already has everything from upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit -m "Merge RiDDiX/RetroArr main" upstream/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The database provider tests skip themselves without RETROARR_TEST_PG/MARIADB
      - name: Test
        run: dotnet test src/RetroArr.Core.Test/RetroArr.Core.Test.csproj -c Release

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # The NAS (NAS) is x86-64
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/dviree/RetroArrNAS
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=nas-image
          cache-to: type=gha,mode=min,scope=nas-image
